# doma catalog — each [section] names a corpus: a filtered view of the tree.
# path is project-root-relative; ext is a comma list (default: md);
# exclude is a comma list of path prefixes. Query with `doma <name> <query>`.

[doma]
default = code

[code]
path = .
ext = odin
exclude = docs

[docs]
path = docs
